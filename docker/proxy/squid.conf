# Proxy sortant : seuls les hôtes de allowed_hosts.txt sont joignables, en HTTP(S) standard.
http_port 3128

acl allowed_hosts dstdomain "/etc/squid/allowed_hosts.txt"
acl safe_ports port 80 443
acl ssl_ports port 443
acl connect_method method CONNECT

http_access deny !safe_ports
http_access deny connect_method !ssl_ports
http_access allow allowed_hosts
http_access deny all

cache deny all
access_log /var/log/squid/access.log squid
pid_filename none
coredump_dir /tmp
via off
forwarded_for delete
